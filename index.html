<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Even in onderhoud — Anders Luisteren</title>
  <style>
    :root {
      --bg-primary: #faf8f5;
      --bg-card: #ffffff;
      --text-primary: #1e242b;
      --text-secondary: #5a6572;
      --accent: #2f6f5e;
      --accent-soft: #e6f0ed;
      --border: #e8e4dd;
      --shadow: 0 20px 40px -15px rgba(30, 36, 43, 0.07);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #121619;
        --bg-card: #1b2126;
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --accent: #52b79a;
        --accent-soft: rgba(82, 183, 154, 0.14);
        --border: #2b343b;
        --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.45);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      max-width: 520px;
      width: 100%;
      padding: 3rem 2.5rem;
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-wrapper {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.75rem;
      border-radius: 50%;
      background-color: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrapper svg {
      width: 34px;
      height: 34px;
    }

    .brand {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    p {
      color: var(--text-secondary);
      font-size: 1.02rem;
      margin-bottom: 1.5rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      background-color: var(--accent-soft);
      color: var(--accent);
      font-size: 0.875rem;
      font-weight: 500;
      margin-top: 0.5rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-align: center;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    footer a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    @media (max-width: 480px) {
      .card {
        padding: 2.25rem 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon-wrapper" aria-hidden="true">
      <!-- Soundwave / Listening Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 10v3" />
        <path d="M6 6v11" />
        <path d="M10 3v18" />
        <path d="M14 8v7" />
        <path d="M18 5v13" />
        <path d="M22 10v3" />
      </svg>
    </div>

    <div class="brand">Anders Luisteren</div>
    <h1>We zijn momenteel even in onderhoud</h1>
    <p>
      We werken op dit moment achter de schermen aan verbeteringen voor
      <strong>andersluisteren.com</strong>. Over een klein moment zijn we weer volledig bereikbaar.
    </p>
    <p style="margin-bottom: 1.25rem;">
      Bedankt voor je geduld!
    </p>

    <div class="status-pill" aria-live="polite">
      <span class="pulse-dot"></span>
      <span>Onderhoud bezig &mdash; snel weer online</span>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> <a href="https://andersluisteren.com">Anders Luisteren</a> &bull; andersluisteren.com
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
