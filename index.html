<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Even in onderhoud — Anders Luisteren</title>
  <style>
    :root {
      --brand-blue: #286ee6;
      --brand-blue-soft: #eef4ff;
      --brand-pink: #f2227b;
      --brand-pink-soft: #fff0f6;
      --bg-primary: #f6f9fe;
      --bg-card: #ffffff;
      --text-primary: #152238;
      --text-secondary: #52627a;
      --border: #e2eaf4;
      --shadow: 0 24px 48px -12px rgba(40, 110, 230, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --brand-blue: #4c8dff;
        --brand-blue-soft: rgba(76, 141, 255, 0.14);
        --brand-pink: #ff3d8e;
        --brand-pink-soft: rgba(255, 61, 142, 0.14);
        --bg-primary: #0f1521;
        --bg-card: #172030;
        --text-primary: #f3f6fb;
        --text-secondary: #9fb0c7;
        --border: #25334a;
        --shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      background-image:
        radial-gradient(circle at 15% 20%, var(--brand-pink-soft) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, var(--brand-blue-soft) 0%, transparent 45%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      overflow: hidden;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      max-width: 540px;
      width: 100%;
      padding: 3.25rem 2.5rem 2.75rem;
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--brand-pink) 0%, var(--brand-blue) 100%);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-wrapper {
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper img {
      max-width: 280px;
      width: 100%;
      height: auto;
      display: block;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    p {
      color: var(--text-secondary);
      font-size: 1.03rem;
      margin-bottom: 1.4rem;
    }

    p strong {
      color: var(--brand-blue);
      font-weight: 600;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 1.15rem;
      border-radius: 9999px;
      background-color: var(--brand-blue-soft);
      color: var(--brand-blue);
      font-size: 0.875rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--brand-pink);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-align: center;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    footer a:hover {
      color: var(--brand-blue);
      border-color: var(--brand-blue);
    }

    @media (max-width: 480px) {
      .card {
        padding: 2.5rem 1.5rem 2.25rem;
      }

      .logo-wrapper img {
        max-width: 220px;
      }

      h1 {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo-wrapper">
      <img src="/anders-luisteren-logo.png" alt="Anders Luisteren" width="692" height="85" />
    </div>

    <h1>We zijn momenteel even in onderhoud</h1>
    <p>
      We werken op dit moment achter de schermen aan verbeteringen voor
      <strong>andersluisteren.com</strong>. Over een klein moment zijn we weer volledig bereikbaar.
    </p>
    <p style="margin-bottom: 1.25rem;">
      Bedankt voor je geduld!
    </p>

    <div class="status-pill" aria-live="polite">
      <span class="pulse-dot"></span>
      <span>Onderhoud bezig &mdash; snel weer online</span>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> <a href="https://andersluisteren.com">Anders Luisteren</a> &bull; andersluisteren.com
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
